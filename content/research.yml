# ---------------------------------------------------------------------------
# The three research pillars — the single source for both the landing page
# cards and the research page sections.
#
# accent : accent-1 (blue) | accent-2 (pink) | accent-3 (purple)
# card_title : optional short form used on the landing tiles. The full `title`
#          is what the research page section uses.
# label  : one word above the title on the landing tile. Defaults to the id.
# tools  : ids from tools.yml. Omit for a pillar with no app yet — the section
#          then ends with its papers, which is a deliberate layout, not a gap.
# body   : one string per paragraph.
# papers : citation KEYS from content/papers.bib — never retyped metadata.
#          Title, authors, venue and the link are read from the bib, so a
#          correction there fixes every page at once. A key that is not in the
#          bib is skipped, and the build says so.
# ---------------------------------------------------------------------------

pillars:
