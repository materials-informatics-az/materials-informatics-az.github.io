# ---------------------------------------------------------------------------
# The group. Adding, removing or promoting someone is an edit to THIS FILE
# and nothing else — no new page, no template change.
#
# role      : the chip on the card. Keep the vocabulary short and consistent.
# role_tone : accent-1 (blue) | accent-2 (pink) | accent-3 (purple)
# topic     : ONE line. This is the field that makes a small roster read as full.
# fellowship: renders the star badge on the card. The band lower down is a
#             separate hand-written list — keep the two in step yourself.
# links     : label -> address. `email` is turned into a mailto: automatically.
#             A value left in [brackets] renders as muted text, not a dead link,
#             so an unfilled field is visible rather than broken.
#
# ---------------------------------------------------------------------------

