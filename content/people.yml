# ---------------------------------------------------------------------------
# The fellowships band. Written by hand, in the order you want it read.
# ---------------------------------------------------------------------------

fellowships:
  # The star badge pinned to each person's photo. That badge is still driven by
  # `fellowship:` on the member above — this switch only turns the badges off.
  badges: true

  # Each entry is a name and its holders.
  #   name    — the award, exactly as it should read
  #   holders — a LIST of names, joined with ' · ' on the page, or a single
  #             string when the line is a sentence rather than a roster
  awards:
    - name: NSF GRFP
      holders:
        - I-Tzu (2026)
        - Sheila  (2023)
    - name: College and Program Awards
      holders:
        - "Sheila: Al Scott Prize & Lecture (2026)"
        - "Leo: Herbold Fellowship (2025)"
        - "Thomas: Sulzer Mines Scholarship (2024)"
    - name: Travel Awards
      holders:
        - Sheila (Herbert E. Carter, CVPR)
        - Thomas (CODAS-HEP)

  # Optional. Sits under the heading in the left column; omit it and the column
  # is just the heading.
  intro:

# ---------------------------------------------------------------------------

join:
  # Set to false when you are not recruiting — the tile disappears from the
  # roster grid and nothing else moves.
  enabled: true
  title: Join us
  text: >-
    We are accepting applications for postdoc position on non-destructive evaluation and characterization of alloys. If you have a relevant hands-on experience demonstrated with publications, please email your CV and brief statement of interest with "NDE postdoc" in subject line.  
  href: "mailto:materials.informatics.lab@gmail.com"
  cta: Apply by email

group_photo:
  # `src` is the photo. Displayed at ~1072 px, so 1600 px is the retina width —
  # see the image table in NOTES.md. `placeholder` is the caption shown in the
  # empty frame when `src` is unset; it is text, never a path.
  src: static/img/group-f2025.jpg
  placeholder: "[Group photo]"

alumni:
